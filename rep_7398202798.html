    (function(){
      const map = map_3b17919b495167f7eda22d37d495d878;
      const status = document.getElementById('pos-status');
      const retry = document.getElementById('pos-retry');
      let ownMarker = null, accuracyCircle = null, watchId = null;
      let firstFix = true;
      function message(value){ status.textContent = value; }
      function update(position){
        const lat = position.coords.latitude, lon = position.coords.longitude;
        const accuracy = position.coords.accuracy || 0;
        if(!ownMarker){
          ownMarker = L.circleMarker([lat,lon], {radius:9,color:'#fff',weight:3,
              fillColor:'#1677ff',fillOpacity:1}).addTo(map).bindPopup('موقعك الحالي');
          accuracyCircle = L.circle([lat,lon], {radius:accuracy,color:'#1677ff',
              weight:1,fillOpacity:0.08,interactive:false}).addTo(map);
        }else{
          ownMarker.setLatLng([lat,lon]);
          accuracyCircle.setLatLng([lat,lon]);
          accuracyCircle.setRadius(accuracy);
        }
        if(firstFix){ map.setView([lat,lon], Math.max(map.getZoom(),14)); firstFix=false; }
        retry.style.display='none';
        message('تم تحديد موقعك تلقائيًا — الدقة التقريبية: '+Math.round(accuracy)+' متر.');
      }
      function failed(error){
        const msg = error.code === 1 ? 'صلاحية الموقع مرفوضة. اسمح بها من إعدادات المتصفح.' :
          error.code === 2 ? 'الموقع غير متاح. تأكد من تفعيل GPS وخدمات الموقع.' :
          'انتهت مهلة تحديد الموقع. حاول مرة أخرى.';
        message(msg); retry.style.display='inline-block';
      }
      function start(){
        if(!navigator.geolocation){message('المتصفح لا يدعم تحديد الموقع.');return;}
        if(!window.isSecureContext){message('افتح رابط GitHub Pages باستخدام HTTPS لتفعيل الموقع.');return;}
        retry.style.display='none';message('جاري تحديد موقعك تلقائيًا...');
        if(watchId !== null)navigator.geolocation.clearWatch(watchId);
        watchId=navigator.geolocation.watchPosition(update,failed,
          {enableHighAccuracy:true,timeout:20000,maximumAge:10000});
      }
      retry.addEventListener('click',start);
      start();
    })();
